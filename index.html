<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd23f">
<title>時間差レコード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&display=swap">
<style>
/* タイトルは黄色いポップなカセット、ゲーム中は淡い木漏れ日の学校（単一テーマ） */
:root{
  --ink:#4f4651;
  --ink2:#3a2e39;
  --line:#7a6f7d;
  --paper:#f7f2e8;
  --leaf:#8cc63f;
  --leaf-d:#5f9a3a;
  --coral:#e3958a;
  --lav:#b8acc6;
  --shadow:rgba(110,92,130,.28);
  --sun:#ffd23f;
  --pink:#ff5c8a;
  --teal:#2fbfa8;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#141018;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--font);cursor:pointer;color:var(--ink);touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px dashed var(--leaf-d);outline-offset:3px}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:8px;box-shadow:5px 6px 0 var(--shadow);padding:18px;max-width:min(720px,calc(100vw - 32px));width:100%}
.btn{font-size:16px;padding:10px 16px;border:2px solid var(--line);border-radius:8px;background:#fffdf8;box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.green{background:#cfe7a6;border-color:var(--leaf-d)}
.btn.coral{background:var(--coral);color:#fff;border-color:#b9706a}
.ghost{background:none;border:none;font-size:14px;text-decoration:underline;padding:6px}

/* ---------- タイトル ---------- */
#title{position:fixed;inset:0;z-index:24;background-color:var(--sun);background-image:radial-gradient(rgba(255,255,255,.4) 2px,transparent 2.6px);background-size:24px 24px;display:flex;align-items:center;justify-content:center;transition:opacity .6s;padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#title.fade{opacity:0;pointer-events:none}
.tbox{display:flex;flex-direction:column;align-items:center;gap:min(2.6vh,14px);width:100%}
.cassette{position:relative;width:min(600px,72vw,calc(60vh * 1.6));aspect-ratio:16/10;filter:drop-shadow(0 8px 0 rgba(58,46,57,.18))}
.cassette svg{width:100%;height:100%;display:block}
.reel{transform-box:fill-box;transform-origin:center}
.spinning .reel{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;left:11%;right:11%;top:12%;height:34%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink2)}
.label > div{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.label h1{font-family:var(--pop);font-weight:400;font-size:clamp(22px,min(6.2vw,10vh),60px);margin:0;letter-spacing:.04em;line-height:1.1}
.label .lbl{font-family:var(--pop);font-size:clamp(11px,min(1.9vw,3.2vh),17px);margin:0;letter-spacing:.08em;opacity:.75}
.label input{font-family:var(--pop);font-size:clamp(18px,min(4.4vw,7.5vh),40px);text-align:center;border:none;border-bottom:3px dashed var(--ink2);background:transparent;color:var(--ink2);width:80%;padding:2px 4px;border-radius:0}
.label input:focus{outline:none;border-bottom-style:solid}
#codeIn{text-transform:uppercase;letter-spacing:.3em;width:70%}
.label .code{font-family:var(--pop);font-size:clamp(26px,min(7vw,11vh),64px);letter-spacing:.18em;margin:0;line-height:1.1}
.label .status{font-family:var(--pop);font-size:clamp(14px,min(2.8vw,5vh),24px);margin:0}
.label .err{font-size:clamp(11px,min(1.8vw,3vh),15px);color:#c43c5a;margin:0}
.tbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tbtn{font-family:var(--pop);font-size:clamp(14px,min(2.6vw,4.6vh),20px);padding:.55em 1.3em;border-radius:999px;border:3px solid var(--ink2);background:#fffdf6;color:var(--ink2);box-shadow:0 4px 0 var(--ink2);display:flex;align-items:center;gap:.45em}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink2)}
.tbtn.rec{background:var(--pink);color:#fff}
.tbtn.play{background:var(--teal);color:#fff}
.tbtn.sub{font-size:clamp(12px,min(2vw,3.6vh),15px);box-shadow:0 3px 0 var(--ink2);border-width:2px}
.tbtn:disabled{opacity:.4}
.tlink{background:none;border:none;font-family:var(--pop);font-size:12px;color:var(--ink2);opacity:.55;text-decoration:underline;padding:4px}
.snd{display:flex;align-items:center;gap:6px;margin:0;font-family:var(--pop);font-size:clamp(11px,min(1.8vw,3.2vh),14px);color:var(--ink2)}
.snd svg{width:1.3em;height:1.3em}
.ver{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0;font-size:11px;letter-spacing:.12em;color:var(--ink2);opacity:.45}

/* ---------- HUD ---------- */
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;pointer-events:none;flex-wrap:wrap;z-index:5}
.chip{background:rgba(247,242,232,.92);border:2px solid var(--line);border-radius:6px;padding:4px 9px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:2px 2px 0 var(--shadow)}
.chip .mode{background:var(--ink);color:var(--paper);padding:1px 6px;border-radius:3px}
#keys{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font-size:12px;background:rgba(247,242,232,.85);border-radius:6px;padding:4px 8px;pointer-events:none;z-index:5}

/* ---------- スティックとボタン ---------- */
#zone{position:fixed;left:0;top:0;bottom:0;width:55%;touch-action:none;z-index:3}
#stick{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(247,242,232,.18);border:2px solid rgba(247,242,232,.55);pointer-events:none;z-index:4;opacity:.55;transition:opacity .2s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(247,242,232,.9);box-shadow:0 2px 0 rgba(58,46,57,.25)}
#act{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:3px solid var(--line);background:var(--paper);box-shadow:3px 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;line-height:1.15;z-index:6;padding:0}
#act:active{transform:translate(2px,2px);box-shadow:1px 2px 0 var(--shadow)}
#act .ic{font-size:22px;line-height:1}
#act.rec{background:var(--coral);border-color:#b9706a;color:#fff}
#act.answer{background:#cfe7a6;border-color:var(--leaf-d);animation:bob .35s steps(2) infinite}
#act.fog{background:#5b3df5;border-color:#3a22c4;color:#fff;box-shadow:3px 4px 0 rgba(58,34,196,.35),0 0 18px rgba(110,80,255,.55)}
#act.na{opacity:.55}
@keyframes bob{50%{transform:translateY(-3px)}}
#act2{position:fixed;right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:6;font-size:14px}

/* ---------- CD ---------- */
#cds{position:fixed;right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,42vw);max-height:calc(100% - 70px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;background:rgba(247,242,232,.96);border:2px solid var(--line);border-radius:10px;padding:10px;box-shadow:4px 5px 0 var(--shadow);z-index:6}
#cds h3{margin:0;font-size:14px;font-weight:400;display:flex;justify-content:space-between}
#cdList{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.cditem{display:flex;align-items:center;gap:10px;text-align:left;background:#fffdf8;border:1.5px solid var(--lav);border-radius:30px 8px 8px 30px;padding:4px 10px 4px 4px;font-size:14px}
.cditem .nm{flex:1;min-width:0}
.cditem .pl{color:var(--leaf-d);font-size:15px}
.disc{display:block;width:44px;height:44px;border-radius:50%;flex:none;position:relative;background:conic-gradient(from 20deg,#e9e3f3,#f9dbe4,#dcf1ea,#fbf0c6,#dde6f8,#f3dff0,#e9e3f3);box-shadow:inset 0 0 0 1px rgba(79,70,81,.18)}
.disc::before{content:"";position:absolute;inset:32%;border-radius:50%;background:#fbf8f2;box-shadow:0 0 0 2px rgba(255,255,255,.8),inset 0 0 0 1px rgba(79,70,81,.15)}
.disc::after{content:"";position:absolute;inset:45%;border-radius:50%;background:#bdb3c4}
.disc.spin{animation:spin 1.6s linear infinite}
#cdEmpty{font-size:13px;opacity:.7;margin:0}

#toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(79,70,81,.92);color:var(--paper);padding:7px 14px;border-radius:6px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;z-index:30}
#toast.on{opacity:1}

#dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s,background .3s;z-index:10}
#dimmer.black{opacity:1;background:#000}
#dimmer.soft{opacity:1;background:rgba(26,20,34,.6)}
#glow{position:fixed;top:0;right:0;bottom:0;width:42vw;background:linear-gradient(to left,rgba(255,240,206,.85),rgba(255,226,196,.35) 35%,rgba(255,226,196,0));opacity:0;pointer-events:none;z-index:11;mix-blend-mode:screen}
#call{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:rgba(255,255,255,.45);font-size:14px;letter-spacing:.1em;z-index:12;pointer-events:none;font-variant-numeric:tabular-nums}
#stopBtn{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:13}

.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(40,32,48,.35);overflow:auto;z-index:20}
.modal .panel{margin:auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
.panel-head h2{margin:0;font-size:19px;font-weight:400}
.sub{margin:0 0 10px;font-size:13px;opacity:.8;line-height:1.6}
.cardrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{text-align:left;background:#fffdf8;border:2px solid var(--lav);border-radius:8px;box-shadow:3px 4px 0 var(--shadow);padding:10px;min-height:110px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5}
.card:active{border-color:var(--leaf-d)}
.tag{display:inline-block;align-self:flex-start;font-size:11px;padding:2px 7px;border-radius:3px;letter-spacing:.06em}
.tag.free{background:#d9ebbb}.tag.topic{background:#f3e3b3}.tag.line{background:#f2cfd4}.tag.last{background:var(--ink);color:var(--paper)}
.chosen{border:2px dashed var(--lav);border-radius:8px;padding:10px;margin:6px 0 10px;display:flex;flex-direction:column;gap:6px}
.chosen p{margin:0;font-size:17px;line-height:1.5}
.meter{height:12px;border-radius:6px;background:#ece5d8;overflow:hidden}
#meterFill{height:100%;width:0;background:var(--leaf)}
#recTime{font-variant-numeric:tabular-nums;font-size:13px;margin:6px 0 10px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.recmain{display:flex;justify-content:center;margin:2px 0 12px}
.recbig{width:118px;height:118px;border-radius:50%;border:4px solid #fff;background:#ff2b3a;color:#fff;font-size:15px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 0 0 4px #ff2b3a,0 6px 0 4px #b3121f;animation:recpulse 1.4s ease-in-out infinite}
.recbig .dot{width:26px;height:26px;border-radius:50%;background:#fff}
.recbig:active{transform:translateY(3px);box-shadow:0 0 0 4px #ff2b3a,0 3px 0 4px #b3121f}
.recbig.stop{background:#3a2e39;box-shadow:0 0 0 4px #3a2e39,0 6px 0 4px #1d161c;animation:none}
.recbig.stop .dot{border-radius:4px;background:#ff2b3a}
@keyframes recpulse{50%{box-shadow:0 0 0 10px rgba(255,43,58,.35),0 6px 0 4px #b3121f}}
.btnrow.center{justify-content:center}
#discardList .dwrap{position:relative;flex:none;border:none;background:none;padding:0;width:40px;height:40px;border-radius:50%}
#discardList .dwrap .disc{width:40px;height:40px}
#discardList .dwrap .pi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#3a2e39;z-index:1;text-shadow:0 0 3px #fff}
@media (max-height:520px){.recbig{width:96px;height:96px;font-size:13px}}
#micErr{margin-top:10px;font-size:13px;line-height:1.6;border-top:1.5px dashed var(--lav);padding-top:8px}
#discardList{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;max-height:46vh;overflow:auto}
#discardList label{display:flex;gap:10px;align-items:center;font-size:15px;background:#fffdf8;border:1.5px solid var(--lav);border-radius:30px 8px 8px 30px;padding:4px 10px 4px 4px;cursor:pointer}
#discardList input{accent-color:var(--leaf-d);margin-left:auto}
#discardList .disc{width:36px;height:36px}

.dark{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#f4f0ea;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.dark .q{font-size:15px;opacity:.55;letter-spacing:.2em;margin:0}
.dark button{background:none;border:none;color:#f4f0ea;font-size:clamp(18px,4vw,24px);padding:6px 10px;opacity:.75}
.dark button:hover,.dark button:focus-visible{opacity:1;text-decoration:underline;outline:none}

#rotate{position:fixed;inset:0;z-index:99;background:var(--sun);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:var(--pop);color:var(--ink2);font-size:18px;text-align:center;padding:24px}
#rotate svg{width:72px;height:72px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}

@media (max-height:520px){
  .card{min-height:84px;font-size:14px;padding:8px}
  .panel{padding:12px}
  .chosen p{font-size:15px}
  #act{width:84px;height:84px;font-size:13px}
  #act2,#cds{right:calc(116px + env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){.recbig,#act.answer,.spinning .reel,.disc.spin{animation:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="zone" hidden></div>
<div id="stick" hidden><div id="knob"></div></div>
<div id="dimmer"></div>
<div id="glow"></div>
<div id="call" hidden>つうわちゅう <span id="callTime">0:00</span></div>
<button id="stopBtn" class="btn" hidden>やめる</button>

<div id="hud" hidden>
  <div class="chip"><span class="mode" id="modeLabel">かくす</span><span id="countLabel"></span></div>
  <div class="chip" id="room">校庭</div>
</div>
<div id="keys" hidden>WASD・矢印で移動　スペースで決定</div>

<button id="act" hidden><span class="ic" id="actIc">●</span><span id="actTx">ろくおん</span></button>
<button id="act2" class="btn" hidden>さいごの でんわを かくす</button>

<div id="cds" hidden>
  <h3><span>もっている こえ</span><span id="cdCount">0</span></h3>
  <p id="cdEmpty">でんわに でると、ここに のこるよ</p>
  <div id="cdList"></div>
</div>
<div id="toast" role="status"></div>

<!-- タイトル -->
<div id="title">
  <div class="tbox">
    <div class="cassette" id="cassette">
      <svg viewBox="0 0 320 200" aria-hidden="true">
        <rect x="4" y="8" width="312" height="188" rx="16" fill="#d9502f"/>
        <rect x="4" y="4" width="312" height="186" rx="16" fill="#ff7a59"/>
        <circle cx="18" cy="18" r="4" fill="#d9502f"/><circle cx="302" cy="18" r="4" fill="#d9502f"/>
        <circle cx="18" cy="176" r="4" fill="#d9502f"/><circle cx="302" cy="176" r="4" fill="#d9502f"/>
        <rect x="24" y="18" width="272" height="132" rx="9" fill="#fff4dc"/>
        <rect x="24" y="94" width="272" height="3.2" fill="#ff5c8a"/>
        <rect x="24" y="98" width="272" height="3.2" fill="#ffb443"/>
        <rect x="24" y="102" width="272" height="3.2" fill="#2fbfa8"/>
        <rect x="24" y="106" width="272" height="3.2" fill="#4f8cff"/>
        <rect x="94" y="114" width="132" height="30" rx="15" fill="#3a2e39"/>
        <rect x="128" y="124" width="64" height="10" fill="#6b4b3e"/>
        <g class="reel"><circle cx="124" cy="129" r="12" fill="#fff4dc"/><circle cx="124" cy="129" r="4.5" fill="#3a2e39"/><rect x="122.5" y="118.5" width="3" height="5" fill="#3a2e39"/><rect x="122.5" y="134.5" width="3" height="5" fill="#3a2e39"/><rect x="113.5" y="127.5" width="5" height="3" fill="#3a2e39"/><rect x="129.5" y="127.5" width="5" height="3" fill="#3a2e39"/></g>
        <g class="reel"><circle cx="196" cy="129" r="12" fill="#fff4dc"/><circle cx="196" cy="129" r="4.5" fill="#3a2e39"/><rect x="194.5" y="118.5" width="3" height="5" fill="#3a2e39"/><rect x="194.5" y="134.5" width="3" height="5" fill="#3a2e39"/><rect x="185.5" y="127.5" width="5" height="3" fill="#3a2e39"/><rect x="201.5" y="127.5" width="5" height="3" fill="#3a2e39"/></g>
        <path d="M74 190 L88 160 L232 160 L246 190 Z" fill="#e8613f"/>
        <circle cx="112" cy="176" r="5" fill="#d9502f"/><circle cx="208" cy="176" r="5" fill="#d9502f"/>
        <rect x="146" y="170" width="28" height="10" rx="3" fill="#d9502f"/>
      </svg>
      <div class="label">
        <div id="lHome"><h1>時間差レコード</h1></div>
        <div id="lName" hidden><p class="lbl">だれへの テープ？（呼び名）</p><input id="nameIn" maxlength="10" autocomplete="off" placeholder="なまえ"></div>
        <div id="lCode" hidden><p class="lbl">テープの コードを 入れてね</p><input id="codeIn" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123"><p class="err" id="codeErr" hidden></p></div>
        <div id="lStatus" hidden><p class="status" id="statusTx"></p></div>
        <div id="lDone" hidden><p class="lbl" id="doneTo"></p><p class="code" id="codeOut"></p><p class="err" id="doneErr" hidden></p></div>
      </div>
    </div>
    <div class="tbtns" id="bHome">
      <button class="tbtn rec" id="goRec">● 録音する</button>
      <button class="tbtn play" id="goListen">▶ レコードを聞く</button>
    </div>
    <div class="tbtns" id="bName" hidden>
      <button class="tbtn rec" id="nameGo">はじめる</button>
      <button class="tbtn sub back">もどる</button>
    </div>
    <div class="tbtns" id="bCode" hidden>
      <button class="tbtn play" id="codeGo">きく</button>
      <button class="tbtn sub back">もどる</button>
    </div>
    <div class="tbtns" id="bDone" hidden>
      <button class="tbtn play" id="copyBtn">コードを コピー</button>
      <button class="tbtn sub" id="hereBtn">この端末で 聞く</button>
      <button class="tbtn sub" id="retryBtn" hidden>もう一度 保存する</button>
      <button class="tbtn sub" id="homeBtn">タイトルへ</button>
    </div>
    <button class="tlink" id="testBtn" hidden>マイクなしで テスト（テスト音を 自動で かくす）</button>
    <p class="snd" id="sndNote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>音を 出して あそんでね</p>
  </div>
  <p class="ver" id="ver"></p>
</div>

<!-- カード -->
<div id="cards" class="modal" hidden>
  <div class="panel">
    <div class="panel-head"><h2 id="cardsTitle">なにを はなす？</h2><button id="cardsCancel" class="ghost">やめる</button></div>
    <p class="sub" id="cardsSub"></p>
    <div class="cardrow" id="cardRow"></div>
  </div>
</div>

<!-- 録音 -->
<div id="rec" class="modal" hidden>
  <div class="panel">
    <div class="panel-head"><h2>ろくおん</h2><button id="recCancel" class="ghost">やめる</button></div>
    <div class="chosen"><span class="tag" id="recTag"></span><p id="recText"></p></div>
    <div class="meter"><div id="meterFill"></div></div>
    <div id="recTime">0.0 / 30 びょう</div>
    <div class="recmain">
      <button id="recStart" class="recbig"><span class="dot"></span>ろくおん<br>かいし</button>
      <button id="recStop" class="recbig stop" hidden><span class="dot"></span>とめる</button>
    </div>
    <div class="btnrow center">
      <button id="recPlay" class="btn" hidden>▶ きいてみる</button>
      <button id="recRetry" class="btn" hidden>↺ とりなおす</button>
      <button id="recPlace" class="btn green" hidden>☎ ここに かくす</button>
    </div>
    <div id="micErr" hidden>
      <p style="margin:0 0 8px">マイクが つかえませんでした。設定で このサイトの マイクを 許可するか、音声ファイルを えらんでください。</p>
      <input type="file" id="fileIn" accept="audio/*">
    </div>
  </div>
</div>

<!-- 手放す -->
<div id="discard" class="modal" hidden>
  <div class="panel" style="max-width:480px">
    <h2 id="discardTitle" style="margin:0 0 4px;font-size:19px;font-weight:400"></h2>
    <p class="sub" id="discardText"></p>
    <div id="discardList"></div>
    <div class="btnrow">
      <button id="discardYes" class="btn green">はい、手放す</button>
      <button id="discardNo" class="btn">いいえ</button>
    </div>
  </div>
</div>

<!-- さいごの選択（真っ暗） -->
<div id="endChoice" class="dark" hidden>
  <p class="q">……</p>
  <button id="endClear">こえを ぜんぶ けして、クリアする</button>
  <button id="endAgain">もういちど きく</button>
</div>

<div id="lost" class="dark" style="background:#141018" hidden>
  <p class="q">画面が うまく 表示できなく なりました</p>
  <p id="lostNote" style="margin:0;font-size:14px;opacity:.7"></p>
  <button id="lostBtn">再読み込み する</button>
</div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 14a9 9 0 0 0 7 7"/><path d="M8 21h2v-2"/></svg>よこむきに してね</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game.js?v=0.4.7"></script>
</body>
</html>
